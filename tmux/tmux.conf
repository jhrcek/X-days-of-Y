# ~/.tmux.conf
#
# Assembled over Days 5-14 of the '14 Days of tmux' course. Every line was
# introduced with a reason, and the comments are that reason. Reload with:
#
#     tmux source-file ~/.tmux.conf        (or prefix R, once Day 8 is done)
#

# ==========================================================================
# Day 05 - Options and your first config
# ==========================================================================

# Reload the config without restarting the server. Bind it first, because you will use
# it constantly while building the rest of this file.
bind -N "Reload ~/.tmux.conf" R \
  source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Count windows and panes from 1. The keyboard's number row starts at 1, and reaching
# past 0 for the first window is a small tax paid several hundred times a day.
set -g  base-index 1
set -wg pane-base-index 1
set -g  renumber-windows on

# 2000 lines of scrollback is a 1990s default. This costs a few MB per pane at worst.
set -g history-limit 50000

# Copy mode keys. Choose the one your fingers already know; the default depends on
# $EDITOR, which means it silently differs between machines.
set -wg mode-keys vi

# Mouse: click to select a pane or window, drag borders to resize, wheel to scroll into
# copy mode. Shift-drag still gives you the terminal's own selection when you want it.
set -g mouse on

# How long tmux waits after Escape to see if it was really Alt-something. Older tmux
# defaulted to 500 ms, which made vim feel broken; 3.x already uses 10, so this line is
# insurance against sitting down at an older machine.
set -s escape-time 10

# Let programs in panes see focus gained/lost, so things like vim's autoread work.
set -s focus-events on

# Status line messages vanish after 750 ms by default, which is not long enough to read
# an error you did not expect.
set -g display-time 2000

# ==========================================================================
# Day 06 - Many sessions
# ==========================================================================

# When a session is destroyed, move this client to another session instead of dumping it
# back to the shell. With a session per project you nearly always want to land somewhere.
set -g detach-on-destroy off

# Size each window to the clients that are actually looking at it, rather than to the
# smallest client attached to the session. Good when a phone or a narrow ssh window is
# parked on some other window of the same session.
set -wg aggressive-resize on

# Sessions created detached (new -d, or from a script) get a usable default size instead
# of 80x24, so a layout built by a script is not laid out for a 1978 terminal.
set -g default-size 200x50

# ==========================================================================
# Day 07 - The command language
# ==========================================================================

# Command aliases live in a server option array. Pick indices well above the built-ins
# (0-99 are taken) so you do not shadow anything. Aliases are expanded at parse time,
# which means they work in bindings and config files as well as at the prompt.
set -s command-alias[100] zoom='resize-pane -Z'
set -s command-alias[101] panes='list-panes -a -F "#{pane_id} #{session_name}:#{window_index}.#{pane_index} #{pane_current_command}"'

# ==========================================================================
# Day 08 - Key bindings and key tables
# ==========================================================================

# New panes and windows should open where you already are. This is the single highest
# value rebinding in tmux: without it every split starts in your home directory.
bind -N "Split top/bottom, same directory" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split left/right, same directory" %   split-window -h -c "#{pane_current_path}"
bind -N "New window, same directory"       c   new-window   -c "#{pane_current_path}"

# Mnemonic aliases for the same two splits: the key looks like the border it makes.
# This takes '-' away from delete-buffer, which you can still reach with C-b = then d.
bind -N "Split left/right" '|' split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" '-' split-window -v -c "#{pane_current_path}"

# Type into every pane of this window at once - for the same command on four servers.
# Dangerous enough that the binding announces the state it just moved to.
bind -N "Toggle synchronize-panes" S \
  set -w synchronize-panes \; \
  display-message "synchronize-panes #{?synchronize-panes,ON,off}"

# Copy mode: y copies to a tmux buffer and to the system clipboard, Y does a whole line.
# Set copy-command to your platform's tool - wl-copy, xclip -sel c, or pbcopy.
set -s copy-command 'wl-copy'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe-line-and-cancel

# ==========================================================================
# Day 09 - Formats
# ==========================================================================

# Label each pane on its own border with its index and what is running in it. The whole
# label is a format, so it can react: the zoom marker only appears when it applies.
set -wg pane-border-format " #{pane_index}: #{pane_current_command}#{?pane_zoomed_flag, [zoom],} "
set -wg pane-border-status top

# The name tmux gives an unnamed window. The default is just the command; adding the
# directory makes three shells distinguishable at a glance.
set -wg automatic-rename-format "#{pane_current_command}:#{b:pane_current_path}"

# ==========================================================================
# Day 10 - The status line
# ==========================================================================

# Put the status line at the top. Your shell prompt lives at the bottom of the screen,
# which is exactly where your eyes already are - so the status line competes with it
# there and is ignored. At the top it is where a title bar would be.
set -g status-position top
set -g status-justify left
set -g status-interval 5

# A quiet base: no background of its own, so it borrows the terminal's.
set -g status-style "bg=default,fg=colour245"

# Left: the session name, which is the one piece of state you cannot get any other way.
# Raise the length limit first - it defaults to 10 columns and silently truncates.
set -g status-left-length 40
set -g status-left "#[fg=black,bg=green,bold] #S #[default] "

# Right: a PREFIX indicator (so a half-pressed prefix is never a mystery), the pane
# title, and the clock. Note the escaped commas inside the #[...] directive.
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=black#,bg=yellow#,bold] PREFIX #[default] ,}\
#[fg=colour245] #{=/20/…:pane_title} %H:%M "

# The window list. The current window is inverted; the others are quiet. The zoom flag
# is spelled out because Z among the other flag characters is easy to miss.
set -wg window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -wg window-status-current-format "#[fg=black,bg=colour250,bold] #I:#W#{?window_zoomed_flag, Z,} "
set -wg window-status-separator ""

# Tell me when something happened in a window I was not looking at, but do not interrupt
# me with a message about it - the flag in the status line is enough. C-b M-n jumps to
# the next flagged window.
set -wg monitor-activity on
set -g  visual-activity off
set -g  activity-action other
set -wg monitor-bell on
set -wg window-status-activity-style "fg=yellow,bold"
set -wg window-status-bell-style "fg=red,bold"

# ==========================================================================
# Day 11 - Scripting your workspace
# ==========================================================================

# Edit here, run there. Mark the pane your build runs in with C-b m, then C-b C-r sends
# Up-Enter to it from wherever you are - re-running the last command without leaving the
# editor. The single best two-pane habit in tmux.
bind -N "Repeat the last command in the marked pane" C-r \
  send-keys -t '~' Up Enter

# Toggle a log of everything a pane prints. The file name is a format, so each pane gets
# its own file, and -o makes one binding both start and stop it.
bind -N "Toggle logging this pane" P \
  pipe-pane -o 'cat >>$HOME/tmux-#{session_name}-#{window_index}.#{pane_index}.log' \; \
  display-message "logging #{?pane_pipe,ON,off}"

# Keep a pane that failed, so the error is still on screen. 'failed' means panes whose
# command exited non-zero; a successful command still closes its pane cleanly.
set -wg remain-on-exit failed

# ==========================================================================
# Day 12 - Moving things around
# ==========================================================================

# The other half of C-b ! (break-pane): mark a pane anywhere with C-b m, come here, and
# pull it in. join-pane with no -s uses the marked pane, which is exactly what you want.
bind -N "Join the marked pane here"          @   join-pane
bind -N "Join the marked pane beside this"   M-@ join-pane -h

# Close the gaps in window numbering after killing a few.
bind -N "Renumber windows" M-r move-window -r

# Double-clicking empty space on the status line makes a new window, the way a browser
# tab bar behaves. Mouse events are ordinary bindings in the root table.
bind -n DoubleClick1Status new-window -c "#{pane_current_path}"

# A scrollbar, but only while a pane is in copy mode - so it tells you where you are in
# the history without stealing a column the rest of the time.
set -wg pane-scrollbars modal
set -wg pane-scrollbars-position right

# ==========================================================================
# Day 13 - Hooks, popups and menus
# ==========================================================================

# A scratch shell floating over the work, in the same directory, gone when you exit it.
# Replaces the reflex of splitting a pane for one command and then closing it again.
bind -N "Scratch shell in a popup" C-g \
  display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# Fuzzy session switching, if you have fzf. This is the single binding most likely to
# replace an existing habit: it beats C-b s once you have more than four sessions.
bind -N "Switch session (fzf)" C-j \
  display-popup -E -w 60% -h 50% \
    "tmux ls -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# Create a named session without leaving the keyboard. %% is the answer to the prompt.
bind -N "New named session" C-n \
  command-prompt -p "new session:" \
    "new-session -d -s '%%' -c '#{pane_current_path}' ; switch-client -t '%%'"

# A menu of your own. Each entry is a name, a shortcut key and a command; an empty name
# is a separator, and a name beginning with '-' is greyed out.
bind -N "Session menu" C-s \
  display-menu -T "#[align=centre]#{session_name}" -x C -y C \
    "New session"  n "command-prompt -p name: { new-session -d -s '%%' ; switch-client -t '%%' }" \
    "Rename"       r "command-prompt -I '#S' { rename-session '%%' }" \
    "" \
    "Detach"       d "detach-client" \
    "Kill session" X "confirm-before -p 'kill #S? (y/n)' kill-session"

# Say something when a pane's command dies badly. Pairs with remain-on-exit failed from
# Day 11: the pane stays, and this tells you why.
set-hook -g pane-died 'display-message "pane #{pane_index}: exited #{pane_dead_status}"'

# ==========================================================================
# Day 14 - Environment, terminals, and the finished config
# ==========================================================================

# Refresh these from the client every time a session is created or reattached, so a new
# window after a fresh ssh login has a working agent and display.
set -g update-environment \
  "SSH_AUTH_SOCK SSH_CONNECTION SSH_AGENT_PID DISPLAY WAYLAND_DISPLAY XAUTHORITY"

# TERM inside tmux must be a screen/tmux derivative - this is not the place to name your
# real terminal. Then tell tmux what that real terminal can actually do. Only claim RGB
# if it is true: check with tmux display -p '#{client_termfeatures}' first.
set -s default-terminal "tmux-256color"
set -sa terminal-features ",*256col*:RGB:usstyle:clipboard:hyperlinks"
set -sa terminal-overrides ",*256col*:Tc"

# OSC 52: let a copy inside tmux set the clipboard of the terminal you are sitting at,
# which is the only mechanism that works through ssh. 'external' also stops applications
# inside panes from silently overwriting your tmux buffers.
set -s set-clipboard external

# Set the outer terminal's title from tmux, so a window switcher shows something useful.
set -g set-titles on
set -g set-titles-string "#S: #W - #{b:pane_current_path}"
